[project]
name = "agentrise-mcp"
version = "0.1.0"
description = "Local MCP server exposing push_activity / push_artifacts against the AgentRise ingest API (ING-04, ADR-0014)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # MCP framework — D-02: jlowin/fastmcp v2.x, streamable HTTP transport.
    "fastmcp>=2.0,<3.0",
    # Outbound HTTP to the ingest API. Pinned to match services/api.
    "httpx>=0.27",
    # YAML parser for `.harness/program.yaml` (D-04). Matches services/api pin.
    "pyyaml>=6.0",
    # Loads services/mcp-server/.env at import time (override=False), so
    # AGENTRISE_INGEST_TOKEN can live in a gitignored file rather than the
    # operator's shell rc. Ambient env still wins.
    "python-dotenv>=1.0",
]

# AF-01 (resolved): use PEP 735 `[dependency-groups]` to match services/api's
# convention. Install with `uv sync` (uv reads this group by default) or
# `pip install --group dev services/mcp-server`. `pip install -e .[dev]` no
# longer resolves the dev extras — that spelling was moved to the sibling
# service's PEP 735 group and this service now matches (see docs/features/
# ING-04/FLAGS.md § AF-01).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # Mocks outbound HTTP to the ingest API in tests.
    "respx>=0.20",
    # Type stubs for the yaml module (real stubs, not a suppression).
    "types-PyYAML>=6.0",
    # TC-45 live MCP-client handshake — uses fastmcp.Client which is bundled
    # with fastmcp itself, so no extra install; listed here for discoverability.
]

[project.scripts]
# Registration site for F-05 (server.py::main). See plan-validation § Wiring.
agentrise-mcp = "agentrise_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Suppress two upstream deprecation warnings emitted by fastmcp's own imports
# (authlib.jose → joserfc, and authlib.httpx_client → httpx2). Not our code
# and not actionable here; fastmcp v2.x is the current stable line.
filterwarnings = [
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrise_mcp"]
