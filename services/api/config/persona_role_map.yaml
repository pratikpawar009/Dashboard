# Persona role map (Tier-2 source)
#
# Schema: role (string) -> persona (string)
# Valid personas: cio, architect, developer, product-manager, engineering-manager
#
# Three-tier lookup order (see app/core/persona_resolver.py):
#   Tier-1: PERSONA_ROLE_MAP env var (JSON dict) — overrides this file
#   Tier-2: this file (static load-once at startup)
#   Tier-3: Postgres persona_config table — fallback when a role is absent here
#
# Changes require an app restart (no hot-reload in MVP — load-once at startup).
#
# Example:
#   cio: cio
#   admin: cio
#   board_member: cio
#   dev: developer
#
# The five canonical persona names are mapped to themselves below, so a fresh
# checkout resolves a persona instead of falling through all three tiers and
# failing closed with a 403 on every persona-scoped route. Deliberately no
# alias grants privilege here: mapping a broad IdP role such as `admin` to
# `cio` would hand org-wide visibility to that role, which is a decision for
# whoever owns the realm. Add your realm's own role names here (or via
# PERSONA_ROLE_MAP / the Tier-3 persona_config table) as they are agreed.
cio: cio
architect: architect
developer: developer
product-manager: product-manager
engineering-manager: engineering-manager

# Keycloak client-role slugs on the `harness-dashboard` client (matches the
# roster-ingest slug map in app/core/role_map.py). `admin` is deliberately
# omitted -- see the comment in role_map.py.
arch: architect
dev: developer
pm: product-manager
em: engineering-manager
cxo: cio
board_member: cio
