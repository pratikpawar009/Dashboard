[project]
name = "api"
version = "0.1.0"
description = "Dashboard FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    # SQLAlchemy's async engine requires greenlet at runtime, but declares it via
    # platform markers that omit macOS arm64 — so `uv sync` silently skips it on
    # Apple Silicon and every async DB call fails. Declared explicitly (AF-04).
    "greenlet>=3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Outbound HTTP for Keycloak calls (JWKS fetch, code exchange, refresh).
    # PRODUCTION dependency, not dev-only: app/auth/jwks.py imports it at module
    # level, and the Dockerfile builds with `uv sync --no-dev` — leaving it in
    # [dependency-groups].dev made the container fail at boot (AF-03).
    "httpx>=0.27",
    # OIDC/JWT client for Keycloak auth (ADR-0004): 0.x pin for a stable API
    # surface ahead of Authlib's not-yet-released 1.0.
    "authlib>=0.15,<1.0",
    # YAML parser for Tier-2 persona-role config (D-09). PRODUCTION dependency,
    # not dev-only: app/core/persona_resolver.py imports it at module level.
    # Already resolved transitively via uvicorn[standard]'s pyyaml==6.0.3 pin
    # (uv.lock unchanged) — a direct import needs a direct declaration.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # Mocks outbound Keycloak HTTP calls in tests (ADR-0004 / D-06).
    "respx>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
