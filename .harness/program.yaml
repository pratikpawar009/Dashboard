# ─────────────────────────────────────────────────────────────────────────────
# Activity rows — shipped via the MCP `push_activity` tool (ING-04) to
# POST /api/ingest/files (ING-02).
#
# NOT YET BUILT. Both stories are `story-validated` only: no PRD, no plan, no
# code. `app/api/ingest.py` carries an unregistered scaffold stub, so the route
# is a deliberate 404 today (see the comment in `app/main.py`). This section is
# declared now so the manifest is complete when that endpoint lands; nothing
# reads it yet.
# ─────────────────────────────────────────────────────────────────────────────
files:
  - path: docs/activity/activity.jsonl
    kind: activity
    mode: append

# ─────────────────────────────────────────────────────────────────────────────
# Governance counts — shipped via the MCP `push_artifacts` tool (ING-04) to
# POST /api/ingest/artifacts (ING-03).
#
# NOT YET BUILT — same status as files[] above. The `program_artifacts` table
# exists (001_initial_schema) but nothing writes to it yet.
#
# Keys match ProgramArtifact.type values (snake_case). Each source describes how
# to compute one integer count from the local workspace, resolved relative to
# the repo root:
#
#   glob-count       — count files matching `glob` under `path` (dir), skipping
#                      any relative-path matching an entry in `exclude`
#                      (fnmatch, "**" honoured).
#   json-key-count   — read `path` (json file), count top-level object keys,
#                      skipping any listed in `exclude`.
#   json-field-sum   — for every json file matching `glob` under `path`, add the
#                      length of the array at `field` (missing = 0).
#   constant         — fixed integer at `value` (use for "we don't have this
#                      data, keep zero").
# ─────────────────────────────────────────────────────────────────────────────
artifacts:
  prd:
    kind: glob-count
    path: docs/prd
    glob: "*.md"
    exclude: [".wip/**"]

  user_story:
    kind: json-key-count
    path: docs/state/features.json
    exclude: ["last_updated"]

  test_case:
    kind: json-field-sum
    path: docs/test-cases
    glob: "*.json"
    field: test_cases

  arch_diagram:
    kind: constant
    value: 0

  api_spec:
    kind: constant
    value: 0
