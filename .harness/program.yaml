# .harness/program.yaml
# COMMITTED — shared by everyone on this program, reviewed via PR.
#
# Holds everything about the PROGRAM: which program this repo is, who is on it,
# and what gets shipped to the dashboard. Pushed on every run.
#
# Roles live here rather than in the per-developer `profile.yaml` so nobody can
# promote themselves — changing a role means a reviewed commit. The dashboard
# trusts this file and ignores `profile.yaml` entirely.
#
# Everything below is keyed by `programId`: identity, roster, activity rows and
# artifact counts all land against that one id on the dashboard side.

programId: dashboard

# ─────────────────────────────────────────────────────────────────────────────
# Program identity — POST /api/ingest/manifest (ING-10, shipped).
# Feeds the ProgramSummary row behind the program board card.
#
# type must be one of: Greenfield | Brownfield | Upgradation | Migration |
# Maintenance. A value outside that set aborts the ENTIRE request with 400 and
# writes nothing — unlike a bad team[] entry, which only rejects itself.
# ─────────────────────────────────────────────────────────────────────────────
program:
  name: AgentRise Dashboard
  type: Greenfield
  description: >-
    Internal AI-adoption dashboard measuring AI usage and token consumption
    across the org.

# ─────────────────────────────────────────────────────────────────────────────
# Team roster — POST /api/ingest/manifest (ING-10, shipped).
# The authority on who is on this program and what role they hold, so usage is
# attributed without an Azure AD / directory lookup. Lands in `program_roster`.
#
# role: one of the SIX slugs `services/api/app/core/role_map.py` accepts —
#   cxo | board_member | em | arch | pm | dev
#
#   `admin` is NOT accepted, deliberately (ING-10 D-10). It used to fold onto
#   `cio`, which bypasses program scoping entirely, so a program could grant
#   itself org-wide dashboard visibility from inside its own repo. An entry
#   using it is rejected row-by-row with a reason, while the identity write and
#   every other valid entry still commit — so a stray `admin` fails quietly.
#
# aliases: other git identities the same human commits under. Each alias gets
# its own roster row, because usage joins on `usage_events.user`, which carries
# whatever `git config user.email` was set to on the producing machine.
#
# Cap: 500 raw team[] entries, counted BEFORE alias expansion.
# ─────────────────────────────────────────────────────────────────────────────
team:
  - email: pratik.pawar@apexon.com
    name: Pratik Pawar
    role: dev
    aliases:
      - pawar.pratik0903@gmail.com    # this machine's current git user.email
      - pratik.paw@apexon.com

  - email: krunal.dave@apexon.com
    name: Krunal Dave
    role: arch

  - email: vinit.bhamare@apexon.com
    name: Vinit Bhamare
    role: dev

# Unclaimed identities seen in docs/activity/activity.jsonl — add above once
